name: Daily Byte

on:
  # 목표: 매일 시드니 현지 06:00. GitHub cron은 UTC만 지원하고 서머타임을 모르므로
  # 두 시각을 걸어 두고, 아래 'Sydney 06시 확인' 단계에서 맞는 쪽 하나만 진행한다.
  schedule:
    - cron: "0 20 * * *"   # 20:00 UTC = 06:00 AEST (UTC+10, 4~10월)
    - cron: "0 19 * * *"   # 19:00 UTC = 06:00 AEDT (UTC+11, 10~4월 서머타임)
  workflow_dispatch:        # Actions 탭에서 수동 실행 (시각 확인 없이 바로 진행)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-byte
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Australia/Sydney
    steps:
      - name: Sydney 06시 확인 (서머타임에 맞는 cron 하나만 통과)
        id: gate
        if: github.event_name == 'schedule'
        run: |
          OFFSET=$(TZ=Australia/Sydney date +%z)   # +1000 또는 +1100
          case "${{ github.event.schedule }}/$OFFSET" in
            "0 20 * * */+1000"|"0 19 * * */+1100") echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "이번 cron은 현재 시드니 오프셋($OFFSET)과 맞지 않아 건너뜀" ;;
          esac

      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'

      - name: 오늘 날짜(시드니)와 발행 여부 확인
        id: check
        if: github.event_name != 'schedule' || steps.gate.outputs.run == 'true'
        run: |
          TODAY=$(date +%F)
          echo "TODAY=$TODAY" >> "$GITHUB_ENV"
          if [ -f "daily/issues/$TODAY.html" ]; then
            echo "이미 발행됨: $TODAY"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude로 새 호 작성
        if: steps.check.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}   # Claude GitHub 앱 설치 없이 기본 토큰 사용 (Claude는 GitHub 작업을 하지 않음)
          prompt: |
            daily/CLAUDE.md 절차에 따라 ${{ env.TODAY }}자 데일리 바이트를 작성해 줘.
            이 실행 환경에서의 예외:
            - 작업 폴더는 저장소 루트다. CLAUDE.md의 경로는 모두 daily/ 기준으로 읽는다(예: daily/issues/, daily/template/issue.html).
            - 오늘 날짜는 ${{ env.TODAY }}(시드니 시간, Australia/Sydney)다.
            - 2단계의 git pull, 6단계의 build_index.py 실행, 8단계의 커밋·푸시는 하지 않는다. 워크플로가 처리한다.
            - 결과물은 daily/issues/${{ env.TODAY }}.html 파일 하나만 만든다. 다른 파일은 고치지 않는다.
          claude_args: >-
            --allowedTools "WebSearch,WebFetch,Read,Write,Edit,Glob,Grep"
            --model sonnet
            --effort medium
            --max-turns 80

      - name: 검증, 인덱스 갱신, 커밋, 푸시
        if: steps.check.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          F="daily/issues/$TODAY.html"
          test -f "$F" || { echo "::error::$F 가 만들어지지 않았습니다"; exit 1; }
          if grep -q '{{' "$F"; then echo "::error::채워지지 않은 {{ }} 가 남아 있습니다"; exit 1; fi
          [ "$(grep -c '<h2 id="headline">' "$F")" = "1" ] || { echo "::error::headline h2 가 정확히 1개가 아닙니다"; exit 1; }
          python3 daily/build_index.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily/issues daily/index.html
          git commit -m "Issue $TODAY"
          git push
          # GITHUB_TOKEN 푸시가 Pages 빌드를 깨우지 않는 경우를 대비해 빌드를 직접 요청
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          echo "발행: https://singularity-code.github.io/daily/issues/$TODAY.html"
